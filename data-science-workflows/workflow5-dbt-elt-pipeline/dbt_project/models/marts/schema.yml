version: 2

models:
  - name: mart_customer_metrics
    description: "Customer analytics mart with segmentation and activity status"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      
      - name: lifetime_value
        description: "Total revenue from customer"
      
      - name: customer_segment
        description: "Customer value segment"
        tests:
          - accepted_values:
              values: ['VIP', 'High Value', 'Medium Value', 'Low Value']
      
      - name: activity_status
        description: "Customer activity status based on recency"
        tests:
          - accepted_values:
              values: ['Active', 'At Risk', 'Dormant', 'Churned']

  - name: mart_product_performance
    description: "Product performance analytics mart with rankings"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      
      - name: total_revenue
        description: "Total revenue generated by this product"
        tests:
          - not_null
      
      - name: profit_margin_pct
        description: "Profit margin percentage"

  - name: mart_daily_revenue
    description: "Daily revenue analytics with moving averages"
    columns:
      - name: date
        description: "Date of transactions"
        tests:
          - unique
          - not_null
      
      - name: daily_revenue
        description: "Total revenue for the day"
        tests:
          - not_null
      
      - name: revenue_7day_ma
        description: "7-day moving average of revenue"
