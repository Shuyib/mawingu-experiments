name: 'ecommerce_pipeline'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'ecommerce_pipeline'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  ecommerce_pipeline:
    # Config indicated by + and applies to all files under models/staging/
    staging:
      +materialized: view
      +schema: staging
    
    # Config for intermediate models
    intermediate:
      +materialized: view
      +schema: intermediate
    
    # Config for mart models - materialized as tables for performance
    marts:
      +materialized: table
      +schema: marts

# Seeds configuration
seeds:
  +schema: raw

# Documentation
vars:
  # Define project-wide variables here
  current_date: '{{ run_started_at.strftime("%Y-%m-%d") }}'
